<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AG Farmer — New password</title>
  <link rel="icon" href="https://www.ag-farmer.com/ag_farmer_logo.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #032b43, #0284c7 55%, #073a5c);
      color: #0f2744;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 14px;
    }
    .card {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 22px;
      padding: 26px 22px 22px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
    }
    .logo {
      width: 78px;
      height: 78px;
      border-radius: 20px;
      display: block;
      margin: 0 auto 10px;
      object-fit: cover;
      background: #f4f7fb;
    }
    h1 { margin: 0; text-align: center; font-size: 26px; }
    p.lead { margin: 8px 0 18px; text-align: center; color: #5b7083; font-weight: 600; line-height: 1.45; }
    label { display: block; font-weight: 800; font-size: 14px; margin: 12px 0 6px; }
    input {
      width: 100%;
      height: 48px;
      border: 1px solid #c5d8ea;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 16px;
    }
    button {
      width: 100%;
      height: 50px;
      margin-top: 18px;
      border: 0;
      border-radius: 14px;
      background: #0284c7;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { opacity: 0.65; cursor: default; }
    .msg { margin-top: 14px; text-align: center; font-weight: 700; line-height: 1.4; }
    .err { color: #b42318; }
    .ok { color: #067647; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <img class="logo" src="https://www.ag-farmer.com/ag_farmer_logo.png" alt="AG Farmer">
    <h1>New password</h1>
    <p class="lead" id="lead">Enter a new password, then type it again to confirm.</p>
    <label for="a">New password</label>
    <input id="a" type="password" autocomplete="new-password" minlength="6" required>
    <label for="b">Confirm password</label>
    <input id="b" type="password" autocomplete="new-password" minlength="6" required>
    <button id="go" type="submit">Set password</button>
    <div class="msg" id="msg"></div>
  </form>
  <script>
    const code = window.__RESET_OOB || new URLSearchParams(location.search).get('oobCode') || '';
    const state = window.__RESET_STATE || (code ? 'ok' : 'bad');
    const msg = document.getElementById('msg');
    const form = document.getElementById('form');
    const go = document.getElementById('go');

    function say(text, ok) {
      msg.textContent = text;
      msg.className = 'msg ' + (ok ? 'ok' : 'err');
    }

    if (state !== 'ok' || !code) {
      form.querySelectorAll('input, button').forEach((el) => { el.disabled = true; });
      say(state === 'used'
        ? 'This link has already been used. It is closed. Request a new link from the app.'
        : 'This link is incomplete. Request a new reset link from the app.', false);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const a = document.getElementById('a').value;
      const b = document.getElementById('b').value;
      if (a.length < 6) {
        say('Use at least 6 characters.', false);
        return;
      }
      if (a !== b) {
        say('The two passwords do not match.', false);
        return;
      }
      go.disabled = true;
      say('Setting your password…', true);
      try {
        const res = await fetch('/api', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'auth.password.confirm',
            oobCode: code,
            newPassword: a,
          }),
        });
        const json = await res.json();
        if (!json.ok) {
          const err = json.error || '';
          if (err === 'reset_link_expired') say('This link has expired. Request a new one from the app.', false);
          else if (err === 'weak_password') say('Use at least 6 characters.', false);
          else say('The password was not changed. Request a new link and try again.', false);
          go.disabled = false;
          return;
        }
        history.replaceState({}, '', '/reset-password');
        document.getElementById('lead').textContent = 'Your password has been changed. Log in to the app with this password.';
        form.querySelectorAll('input, button').forEach((el) => { el.disabled = true; });
        say('Done. Open the app and log in.', true);
      } catch (e) {
        say('The connection is slow. Try again in a moment.', false);
        go.disabled = false;
      }
    });
  </script>
</body>
</html>
