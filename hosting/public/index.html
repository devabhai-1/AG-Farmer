<!DOCTYPE html>
<html lang="en">

  <style>
    :root {
      --sky: #0284c7;
      --ink: #032b43;
      --bg: #f0f9ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;

      font-weight: 700;
      text-transform: lowercase;
      font-size: 1.1rem;
    }
    p { line-height: 1.6; color: #334155; }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin: 2rem 0 1rem;
    }
    a.btn {
      display: inline-block;
      padding: 0.7rem 1.1rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      background: var(--sky);
      color: #fff;
    }
    a.link {
      color: var(--sky);
      font-weight: 600;
      margin-right: 1rem;
    }
    footer {
      margin-top: 3rem;
      padding-top: 1.25rem;
      border-top: 1px solid #bae6fd;
      font-size: 0.95rem;
      color: #475569;

      &copy; 2026 AG Farmer<br>
